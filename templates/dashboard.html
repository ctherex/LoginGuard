
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LoginGuard Security Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f1f5f9;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card, .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
        }

        .card h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 0;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .panel {
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            width: 100%;
            margin: 10px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #2563eb;
            margin: 5px 5px 5px 0;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .success {
            background: #15803d;
        }

        .danger {
            background: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
        }

        .alert {
            color: #f87171;
            font-weight: bold;
        }

        .footer {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 25px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-button {
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #b91c1c;
        }

        @media (max-width: 650px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
    <div>
        <h1>🛡️ LoginGuard</h1>
        <div class="subtitle">
            Kubernetes Security Monitoring Dashboard
        </div>
        <p>Logged in as: {{ username }}</p>
    </div>

    <div class="header-actions">
        <div class="status" id="status">
            Checking...
        </div>

        <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit" class="logout-button">
                Logout
            </button>
        </form>
    </div>
</header>

    <!-- Statistics -->
    <section class="stats">
        <div class="card">
            <h3>Total Login Attempts</h3>
            <div class="number" id="total">0</div>
        </div>

        <div class="card">
            <h3>Failed Logins</h3>
            <div class="number" id="failed">0</div>
        </div>

        <div class="card">
            <h3>Security Alerts</h3>
            <div class="number" id="alerts">0</div>
        </div>
    </section>

    <!-- Login simulation -->
    <section class="panel">
        <h2>Simulate Login Activity</h2>

        <label for="ip">Simulated Source IP</label>

        <input
            type="text"
            id="ip"
            value="192.168.1.50"
            placeholder="192.168.1.50"
        >

        <button class="success"
                onclick="sendLogin(true)">
            Successful Login
        </button>

        <button onclick="sendLogin(false)">
            Failed Login
        </button>

        <button class="danger"
                onclick="simulateAttack()">
            Simulate Brute-Force Attack
        </button>

        <p id="message" aria-live="polite"></p>
    </section>

    <!-- Events -->
    <section class="panel">
        <h2>Recent Security Events</h2>

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source IP</th>
                        <th>Username</th>
                        <th>Result</th>
                        <th>Failed Count</th>
                        <th>Alert</th>
                    </tr>
                </thead>

                <tbody id="events"></tbody>
            </table>
        </div>
    </section>

    <div class="footer">
        Serving Pod: <span id="pod">Unknown</span>
    </div>

</div>

<script>
    const message = document.getElementById("message");

    async function sendLogin(success) {
        const ip = document.getElementById("ip").value.trim();

        if (!ip) {
            message.textContent = "Enter a source IP address.";
            return;
        }

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ ip, success })
            });

            if (!response.ok) {
                throw new Error("Login request failed");
            }

            const result = await response.json();

            message.textContent = result.alert
                ? "ALERT: Possible brute-force attack detected!"
                : success
                    ? "Successful login recorded."
                    : "Failed login recorded.";

            await loadEvents();

        } catch (error) {
            message.textContent = "Error: " + error.message;
        }
    }

    async function simulateAttack() {
        const buttons = document.querySelectorAll("button");
        buttons.forEach(button => button.disabled = true);

        try {
            for (let i = 0; i < 5; i++) {
                await sendLogin(false);
                await new Promise(resolve => setTimeout(resolve, 300));
            }
        } finally {
            buttons.forEach(button => button.disabled = false);
        }
    }

    async function loadEvents() {
        try {
            const response = await fetch("/events");

            if (!response.ok) {
                throw new Error("Unable to retrieve events");
            }

            const events = await response.json();

            document.getElementById("total").textContent =
                events.length;

            document.getElementById("failed").textContent =
                events.filter(event => !event.success).length;

            document.getElementById("alerts").textContent =
                events.filter(event => event.alert).length;

            const table = document.getElementById("events");
            table.replaceChildren();

            [...events].reverse().forEach(event => {
                const row = document.createElement("tr");

                const values = [
                    new Date(event.timestamp).toLocaleString(),
                    event.ip,
                    event.username || "Simulation",
                    event.success ? "Success" : "Failed",
                    event.failed_attempts,
                    event.alert ? "ALERT" : "-"
                ];

                values.forEach((value, index) => {
                    const cell = document.createElement("td");
                    cell.textContent = value;

                    if (index === 5 && event.alert) {
                        cell.className = "alert";
                    }

                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

        } catch (error) {
            console.error("Failed to load events:", error);
        }
    }

    async function checkHealth() {
        try {
            const response = await fetch("/health");

            if (!response.ok) {
                throw new Error("Service unavailable");
            }

            document.getElementById("status").textContent =
                "● Online";

            // The root endpoint reports the serving pod.
            const infoResponse = await fetch("/info");

            if (infoResponse.ok) {
                const info = await infoResponse.json();

                document.getElementById("pod").textContent =
                    info.pod || "Unknown";
            }

        } catch (error) {
            document.getElementById("status").textContent =
                "● Offline";
        }
    }

    loadEvents();
    checkHealth();

    // Refresh the dashboard every 3 seconds.
    setInterval(loadEvents, 3000);
    setInterval(checkHealth, 3000);
</script>

</body>
</html>
